<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --cream: #f6f1ea; --ink: #141414; --brand: #ff5a36; --brand-dark: #d9431f; }
    html, body { margin: 0; background: var(--cream); }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); font-family: "Inter", sans-serif; color: var(--ink); }
    .full { position: absolute; inset: 0; }
    .c { position: absolute; left: 50%; top: 50%; }
    #bg { background: var(--cream); }
    /* worlds for the anchor swap */
    .world { opacity: 0; display: flex; align-items: center; justify-content: center; }
    .world b { font-size: 300px; font-weight: 900; letter-spacing: -0.04em; opacity: 0.16; }
    .world span { position: absolute; left: 80px; bottom: 70px; font-size: 34px; font-weight: 700; }
    #w1 { background: #e9d8bb; color: #6b4a1e; }
    #w2 { background: #1d2030; color: #c9d0ff; }
    #w3 { background: #b4533a; color: #ffe3d6; }
    /* the hero object */
    #coin { width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb199 0%, var(--brand) 45%, var(--brand-dark) 100%); z-index: 20; opacity: 0; }
    #coin i { position: absolute; inset: 58px; border-radius: 50%; border: 18px solid #fff3ee; }
    /* phone */
    #phone { width: 430px; height: 870px; border-radius: 70px; border: 16px solid var(--ink); background: #fff; opacity: 0; z-index: 10; box-sizing: border-box; }
    #phone .lbl { position: absolute; top: 330px; width: 100%; text-align: center; font-size: 30px; color: #8a847c; }
    #phone .amt { position: absolute; top: 380px; width: 100%; text-align: center; font-size: 84px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
    #phone .row { position: absolute; left: 40px; right: 40px; top: 560px; display: flex; justify-content: space-between; font-size: 28px; padding: 26px 0; border-top: 2px solid #eee; }
    /* card */
    #card { width: 780px; height: 492px; border-radius: 38px; background: linear-gradient(135deg, #2a2a2a, var(--ink)); box-shadow: 0 40px 80px rgba(0,0,0,.35); opacity: 0; z-index: 12; }
    #card .chip { position: absolute; left: 72px; top: 160px; width: 110px; height: 84px; border-radius: 12px; background: linear-gradient(135deg, #e9d29a, #b89650); }
    #card .mk { position: absolute; right: 64px; top: 60px; width: 76px; height: 76px; border-radius: 50%; border: 16px solid var(--brand); box-sizing: border-box; }
    #card .nm { position: absolute; left: 72px; bottom: 56px; color: #fff; font-size: 52px; font-weight: 900; letter-spacing: -0.03em; }
    .pill { opacity: 0; z-index: 14; display: flex; align-items: center; gap: 14px; padding: 14px 26px 14px 14px; border-radius: 60px; background: rgba(255,255,255,.92); font-size: 36px; font-weight: 700; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
    .pill em { width: 48px; height: 48px; border-radius: 50%; background: var(--brand); display: block; }
    /* ring and amount */
    #ring { opacity: 0; z-index: 8; }
    #saved { opacity: 0; z-index: 9; text-align: center; }
    #saved small { display: block; font-size: 38px; color: #8a847c; }
    #saved strong { display: block; font-size: 136px; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    #burst { opacity: 0; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.16) 0deg 7deg, rgba(255,255,255,0) 7deg 18deg); width: 3200px; height: 3200px; border-radius: 50%; z-index: 2; }
    /* void */
    #void { background: #000; opacity: 0; z-index: 30; }
    #line { opacity: 1; z-index: 31; color: #fff; font-size: 64px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; }
    #line span { opacity: 0; }
    #word { opacity: 0; z-index: 21; font-size: 190px; font-weight: 900; letter-spacing: -0.05em; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1920" data-height="1080">
    <div id="bg" class="full"></div>
    <div id="burst" class="c"></div>
    <div id="w1" class="full world"><b>LISBON</b><span>Pastelaria, 07:42</span></div>
    <div id="w2" class="full world"><b>TOKYO</b><span>Vending machine, 23:10</span></div>
    <div id="w3" class="full world"><b>NEW YORK</b><span>Bodega, 12:05</span></div>
    <div id="phone" class="c"><div class="lbl">Rounded up</div><div class="amt" id="pamt">+$0.00</div><div class="row"><span>Coffee</span><span>-$3.60</span></div></div>
    <div id="card" class="c"><div class="chip"></div><div class="mk"></div><div class="nm">loop.</div></div>
    <div id="p1" class="c pill"><em></em>+$0.60</div>
    <div id="p2" class="c pill"><em></em>+$0.25</div>
    <div id="p3" class="c pill"><em></em>+$0.85</div>
    <svg id="ring" class="c" width="700" height="700" viewBox="0 0 700 700">
      <circle cx="350" cy="350" r="310" fill="none" stroke="#e6ddd0" stroke-width="22"/>
      <circle id="arc" cx="350" cy="350" r="310" fill="none" stroke="#ff5a36" stroke-width="22" stroke-linecap="round" stroke-dasharray="1947.8" stroke-dashoffset="1947.8" transform="rotate(-90 350 350)" opacity="0"/>
    </svg>
    <div id="saved" class="c"><small>Saved</small><strong id="amt">$412</strong></div>
    <div id="coin" class="c"><i></i></div>
    <div id="word" class="c">loop.</div>
    <div id="void" class="full"></div>
    <div id="line" class="c"><span id="l1">Spare change</span><span id="l2"> isn't</span><span id="l3"> spare.</span></div>
  </div>
  <script>
    const $ = s => document.querySelector(s);
    gsap.set(".c", { xPercent: -50, yPercent: -50 });
    gsap.set(["#w1", "#w2", "#w3"], { opacity: 0 });
    gsap.set("#p1", { x: -420, y: -350 }); gsap.set("#p2", { x: 0, y: -390 }); gsap.set("#p3", { x: 420, y: -350 });
    const money = v => "$" + Math.round(v).toLocaleString("en-US");
    const tl = gsap.timeline({ paused: true });

    // 1. Hero object: the coin spins up from below and flies at the lens (object as wipe)
    tl.to("#coin", { opacity: 1, duration: 0.01 }, 0);
    tl.fromTo("#coin", { y: 700, scale: 0.55 }, { y: 0, scale: 1, duration: 0.9, ease: "power3.out" }, 0);
    tl.to("#coin", { scaleX: 0.12, duration: 0.11, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.05);
    tl.to("#coin", { scale: 16, duration: 0.55, ease: "power3.in" }, 0.95);

    // 2. Object carry: the same coin shrinks out of full frame into the phone UI
    tl.to("#phone", { opacity: 1, duration: 0.01 }, 1.5);
    tl.to("#coin", { scale: 0.62, y: -200, duration: 0.6, ease: "expo.out" }, 1.5);
    const pa = { v: 0 };
    tl.to(pa, { v: 0.4, duration: 0.6, ease: "power2.out", onUpdate: () => { $("#pamt").textContent = "+$" + pa.v.toFixed(2); } }, 1.9);

    // 3. Anchor swap: the card stays locked, the world whips around it
    tl.to(["#phone", "#coin"], { opacity: 0, duration: 0.01 }, 3.2);
    tl.to(["#card", "#w1"], { opacity: 1, duration: 0.01 }, 3.2);
    const tap = (t, pill) => {
      tl.to("#card", { scale: 0.95, duration: 0.08, ease: "power2.in" }, t);
      tl.to("#card", { scale: 1, duration: 0.25, ease: "back.out(3)" }, t + 0.08);
      tl.fromTo(pill, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, t + 0.1);
    };
    const whip = (from, to, t) => {
      tl.to(from, { x: -1920, filter: "blur(30px)", duration: 0.32, ease: "power3.in" }, t);
      tl.to(from, { opacity: 0, duration: 0.01 }, t + 0.33);
      tl.fromTo(to, { x: 1920, opacity: 1, filter: "blur(30px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.out", immediateRender: false }, t + 0.16);
    };
    tap(3.55, "#p1"); whip("#w1", "#w2", 4.3);
    tap(4.95, "#p2"); whip("#w2", "#w3", 5.6);
    tap(6.2, "#p3");

    // 4. Shape match: every coin chip flies into one ring
    tl.to(["#w3", "#card"], { opacity: 0, duration: 0.3 }, 6.9);
    tl.to(["#p1", "#p2", "#p3"], { x: 0, y: 0, scale: 0.2, opacity: 0, duration: 0.55, ease: "power3.in", stagger: 0.06 }, 6.9);
    tl.fromTo("#ring", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, 7.3);
    tl.to("#saved", { opacity: 1, duration: 0.4 }, 7.4);

    // 5. Rolling value, then the level-up inversion at $1,000
    const sv = { v: 412 };
    tl.to(sv, { v: 999, duration: 3.2, ease: "power1.in", onUpdate: () => { $("#amt").textContent = money(sv.v); } }, 7.6);
    tl.to("#arc", { opacity: 1, duration: 0.01 }, 7.62);
    tl.to("#arc", { attr: { "stroke-dashoffset": 1947.8 * 0.002 }, duration: 3.2, ease: "power1.in" }, 7.63);
    tl.to("#amt", { textContent: "$1,000", duration: 0.01 }, 10.95);
    tl.to("#bg", { backgroundColor: "#ff5a36", duration: 0.12 }, 10.95);
    tl.to("#arc", { stroke: "#ffffff", duration: 0.12 }, 10.95);
    tl.to(["#amt", "#saved small"], { color: "#ffffff", duration: 0.12 }, 10.95);
    tl.fromTo("#amt", { scale: 1.18 }, { scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 10.95);
    tl.to("#burst", { opacity: 1, duration: 0.2 }, 10.95);
    tl.fromTo("#burst", { rotation: 0 }, { rotation: 25, duration: 1.3, ease: "none", immediateRender: false }, 10.95);

    // 6. Void, then the line, word by word
    tl.to("#void", { opacity: 1, duration: 0.01 }, 12.25);
    tl.to("#l1", { opacity: 1, duration: 0.5 }, 12.6);
    tl.to("#l2", { opacity: 1, duration: 0.25 }, 13.55);
    tl.to("#l3", { opacity: 1, duration: 0.25 }, 13.9);

    // 7. Bookend: the coin returns and resolves into the mark
    tl.to(["#void", "#line", "#ring", "#saved", "#burst"], { opacity: 0, duration: 0.01 }, 14.7);
    tl.to("#bg", { backgroundColor: "#f6f1ea", duration: 0.01 }, 14.7);
    tl.to("#coin", { opacity: 1, y: 0, x: 0, scale: 0.2, duration: 0.01 }, 14.7);
    tl.to("#coin", { scale: 0.85, duration: 0.7, ease: "expo.out" }, 14.72);
    tl.to("#coin", { scaleX: 0.08, duration: 0.1, yoyo: true, repeat: 3, ease: "sine.inOut" }, 14.75);
    tl.to("#coin", { x: -300, duration: 0.7, ease: "power3.inOut" }, 15.5);
    tl.fromTo("#word", { opacity: 0, x: 40, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, x: 90, clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power3.out", immediateRender: false }, 15.65);

    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
